/* The CV over the page (cv_overlay in _config.yml), after amaury-micheli.github.io: the page zooms in slightly and blurs, then the CV

@supports not selector(:popover-open) { /* browsers without popovers: the cv item opens the CV page */

html, body { overflow-x: clip; } /* the zoomed page must not widen the screen, a phone's included */
html:has(#cv-overlay:popover-open) { overflow: hidden; }
body:has(#cv-overlay:popover-open) .page { pointer-events: none; interactivity: inert; } /* a click beside the CV only closes it; keys stay in it */
@media screen and (prefers-reduced-motion: no-preference) {
  @supports (animation-timeline: view()) {
    .page { transition: transform 0.325s ease-in-out 0.325s; animation: centre linear both; animation-timeline: view(); }
    body:has(#cv-overlay:popover-open) .page { transform: scale(1.0825); transition-delay: 0s; }
  }
}
@keyframes centre { from { transform-origin: 50% -50vh; } to { transform-origin: 50% calc(100% + 50vh); } } /* the middle of the screen */
#cv-overlay { box-sizing: border-box; flex-direction: column; width: min(100%, 66rem); height: 100%; margin: 0 auto; padding: 0 1rem 3rem; border: 0; overflow: hidden; color: #fff; background: none; opacity: 0; translate: 0 0.25rem; transition: opacity 0.325s ease-in-out, translate 0.325s ease-in-out, display 0.65s allow-discrete, overlay 0.65s allow-discrete; }
#cv-overlay:popover-open { display: flex; opacity: 1; translate: 0; transition-delay: 0.325s, 0.325s, 0s, 0s; }
#cv-overlay::backdrop { background: rgb(0 0 0 / 0); backdrop-filter: blur(0); transition: background-color 0.325s ease-in-out 0.325s, backdrop-filter 0.325s ease-in-out 0.325s, display 0.65s allow-discrete, overlay 0.65s allow-discrete; }
#cv-overlay:popover-open::backdrop { background: rgb(0 0 0 / 0.65); backdrop-filter: blur(0.2rem); transition-delay: 0s; }
@starting-style {
  #cv-overlay:popover-open { opacity: 0; translate: 0 0.25rem; }
  #cv-overlay:popover-open::backdrop { background: rgb(0 0 0 / 0); backdrop-filter: blur(0); }
}
@supports not (overlay: auto) { /* browsers that drop the CV from the top layer at once: close at once */
  #cv-overlay:not(:popover-open) { transition: none; }
  .page { transition-delay: 0s; }
}
#cv-overlay h2 { margin: 3rem 0 1rem; padding: 0; border: 0; color: inherit; text-align: center; }
#cv-overlay > p { margin: 0 0 2rem; text-align: center; }
#cv-overlay .pdf { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; outline: none; } /* only the sheets scroll; focused on opening, for the keys */
#cv-overlay .pdf { flex: 0 1 auto; border: 7px solid rgb(255 255 255 / 0.5); border-radius: 12px; } /* cv_frame: the width and grey of the macOS scroll bar, hugging the sheets when they all fit */
@media (pointer: coarse) {
  #cv-overlay .pdf { border-width: 3px; border-radius: 8px; } /* as a phone's scroll bar */
}
#cv-overlay figure { margin: 0 0 2.5rem; }

#cv-overlay a { color: inherit; }
#cv-overlay .close, #cv-overlay .pdf a { outline-offset: -0.25rem; } /* focus rings inside, not clipped */
#cv-overlay .close { position: absolute; top: 0; right: 0; width: 4rem; height: 4rem; padding: 0; border: 0; color: inherit; background: none; cursor: pointer; }
#cv-overlay .close::before, #cv-overlay .close::after { content: ""; position: absolute; top: 50%; left: 50%; width: 1.25rem; border-top: 1px solid; translate: -50% -50%; rotate: 45deg; } /* a cross */
#cv-overlay .close::after { rotate: -45deg; }
@media (hover: hover) {

}
