  <style>:root {
  --bg: #fff;
  --text: #1d1d1f;
  --muted: #6b6b6b;
  --link: #2a5d9f;
  --rule: #e3e3e3;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121212; --text: #e6e6e6; --muted: #a3a3a3; --link: #9cc3f5; --rule: #2c2c2c; }
}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}

html { font-size: 106.25%; }
body {
  margin: 0;
  font: 1rem/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-wrap: break-word;
}
a { color: var(--link); text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 0.15em; }
a.plain { color: inherit; } /* in Markdown: [text](url){:.plain} */

.hero {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.5rem;
  padding: 2.5rem 1rem;
  color: #fff;
  text-align: center;
  overflow: hidden;
}
.hero.full { min-height: 100vh; min-height: 100svh; box-sizing: border-box; justify-content: flex-end; padding-bottom: 10vh; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(rgb(0 0 0 / 0.3), rgb(0 0 0 / 0.65)); }
.hero .bg { position: absolute; inset: 0; z-index: -2; width: 100%; object-fit: cover; }
.hero:not(.full) .bg { object-position: 50% 0; height: 250%; } /* sky only: the subject stays below the banner */
.hero:not(.full)::before { background: rgb(0 0 0 / 0.6); }
/* Lift the subject above the name: enlarge the photo from its bottom edge, more on phones and short screens.
   The .bg sizes in _layouts/default.html follow the 250%, 140% and 160% heights and these breakpoints. */
.hero.full .bg { top: auto; height: 140%; }
@media (max-width: 480px), (max-height: 500px) {
  .hero.full { padding-bottom: 5vh; }
  .hero.full .bg { height: 160%; }
  .hero.full .card { padding: 1rem 0; }
  .hero.full .role { margin-top: 0.5rem; }
}
@media (max-height: 500px) {
  .hero.full .name { font-size: 1.4rem; }
}
.hero a { color: inherit; text-decoration: none; }
.card { width: min(36rem, 100%); padding: 1.75rem 0; border-block: 1px solid rgb(255 255 255 / 0.7); }
.name, .role, .hero nav a, .hero nav button, h1, h2 { text-transform: uppercase; }
.name { margin: 0; padding-left: 0.3em; font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 600; letter-spacing: 0.3em; }
.hero:not(.full) .name { font-size: 1rem; }
.role { margin: 1rem 0 0; padding-left: 0.2em; font-size: 0.75rem; letter-spacing: 0.2em; line-height: 2; }
@media (min-width: 701px) and (min-height: 501px) {
  .role { font-size: calc(var(--role-size, 1) * 0.75rem); } /* role_size in _config.yml */
}
.hero nav { display: flex; flex-wrap: wrap; justify-content: center; }
.hero nav a, .hero nav button { margin: 0 -1px -1px 0; padding: 0.7rem 1rem 0.7rem calc(1rem + 0.2em); border: 1px solid rgb(255 255 255 / 0.7); font-size: 0.75rem; letter-spacing: 0.2em; }
.hero nav a[aria-current] { background: rgb(255 255 255 / 0.15); }
@media (max-width: 360px) {
  .hero nav a, .hero nav button { padding-inline: calc(0.6rem + 0.2em) 0.6rem; }
}

main { max-width: 42rem; margin: 0 auto; padding: 0 1rem; }
main.wide { max-width: 64rem; }
.wide > h1, .wide > p { text-align: center; }
.wide > h1 { padding-left: 0.2em; } /* the letter-spacing after the last letter: centred */
.wide > p { max-width: 42rem; margin-inline: auto; }
main, .role { text-wrap: pretty; }
h1, h2 { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.2em; }
h1 { margin: 3rem 0 1rem; }
h2 { margin: 3.5rem 0 1.25rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule); color: var(--muted); }
h3 { margin: 1.75rem 0 0.75rem; font-size: 1rem; font-weight: 600; }
p { margin: 0 0 1rem; }

.profile { float: right; width: 15rem; margin: 0.4rem 0 3.5rem 2rem; }
.profile img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.profile.oval img { border-radius: 50%; }
.profile.circle img, .profile.small img { aspect-ratio: 1; border-radius: 50%; }
.profile.small { width: 6.5rem; margin: 0.25rem 0 1rem 1.25rem; }
.profile address { margin-top: 0.8rem; font-style: normal; font-size: calc(var(--address-size, 1) * 1rem); line-height: 1.55; color: var(--muted); }
.profile address span:first-child { color: var(--text); }
.profile address a { color: inherit; text-decoration: none; }
h2 { clear: both; }
@media (max-width: 700px) {
  .profile:not(.small) { float: none; width: min(15rem, 75%); margin: 0 auto 2rem; text-align: center; }
  .profile address { font-size: 0.9rem; }
}
.links, .meta, details, time { color: var(--muted); }
.meta a { color: inherit; }
.list { margin: 0; padding: 0; list-style: none; }
.list li { margin: 0 0 1.1rem; }
.list time { display: block; font-size: 0.85rem; }
details { font-size: 0.92rem; }
summary { cursor: pointer; }
details p { margin: 0.5rem 0 0; }

/* The sizes in _includes/photos.html follow main's width and padding and this 85vh. */
.photos figure { margin: 2.5rem 0; }
.photos a { display: block; margin: 0 auto; width: min(100%, 85vh * var(--ratio)); }
.photos img { display: block; width: 100%; height: auto; }
.photos figcaption { margin-top: 0.5rem; text-align: center; font-size: 0.9rem; color: var(--muted); }
.pdf a { width: 100%; }
.pdf img { background: #fff; box-shadow: 0 0 0 1px var(--rule); forced-color-adjust: none; } /* black text stays on white */

.social { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.25rem 1.25rem; margin: 4rem 0 0; padding: 0; list-style: none; }
.social a { display: block; padding: 0.6rem; color: var(--muted); }
.social svg { display: block; width: 2rem; height: 2rem; fill: currentColor; }
@media (max-width: 480px) {
  .social { column-gap: 0; justify-content: space-evenly; }
  .social a { padding: 0.5rem; }
}

footer { max-width: 42rem; margin: 0 auto; padding: 3rem 1rem 2rem; font-size: 0.85rem; color: var(--muted); text-align: center; }
footer p { margin: 1.5rem 0 0; }
.top { position: relative; display: inline-block; padding: 1.45rem 1rem 0.7rem calc(1rem + 0.2em); border: 1px solid var(--rule); color: inherit; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; }
.top::before { content: ""; position: absolute; top: 0.85rem; left: 50%; width: 0.42rem; height: 0.42rem; border-top: 1px solid; border-left: 1px solid; transform: translateX(-50%) rotate(45deg); } /* chevron */
.top.circle { display: inline-grid; place-items: center; box-sizing: border-box; width: 4.25rem; height: 4.25rem; padding: 0.7rem 0 0 0.2em; border-radius: 50%; }
.top.circle::before { top: 1.2rem; }

@media (hover: hover) {
  a:hover { text-decoration-color: currentColor; }
  .hero nav a:hover, .hero nav button:hover { background: rgb(255 255 255 / 0.15); }
  .social a:hover { color: var(--text); }
  .top:hover { border-color: var(--muted); color: var(--text); }
}
/* What opens over the page, the CV (cv_overlay in _config.yml) or a photo (photo_overlay), after amaury-micheli.github.io: the page zooms
   in slightly and blurs, then the popover of class overlay fades in; closing runs the other way. cv-overlay.css and photo-overlay.css lay
   each one out. */
@supports not selector(:popover-open) { /* browsers without popovers: none */
  .overlay { display: none; }
}
html, body { overflow-x: clip; } /* the zoomed page must not widen the screen, a phone's included */
html:has(.overlay:popover-open) { overflow: hidden; }
body:has(.overlay:popover-open) { pointer-events: none; transition-delay: 0s; } /* a click beside the overlay only closes it, */
body { transition: pointer-events 0s 0.325s allow-discrete; } /* a tap's click included, which comes once the overlay has closed */
body:has(.overlay:popover-open) .page { interactivity: inert; } /* keys stay in the overlay (not yet in Safari) */
@media screen and (prefers-reduced-motion: no-preference) {
  @supports (animation-timeline: view()) {
    .page { transition: transform 0.325s ease-in-out 0.325s; animation: centre linear both; animation-timeline: view(); }
    body:has(.overlay:popover-open) .page { transform: scale(1.0825); transition-delay: 0s; }
  }
}
@keyframes centre { from { transform-origin: 50% -50vh; } to { transform-origin: 50% calc(100% + 50vh); } } /* the middle of the screen */
.overlay { pointer-events: auto; border: 0; color: #fff; background: none; opacity: 0; translate: 0 0.25rem; transition: opacity 0.325s ease-in-out, translate 0.325s ease-in-out, display 0.65s allow-discrete, overlay 0.65s allow-discrete; }
.overlay:popover-open { display: flex; opacity: 1; translate: 0; transition-delay: 0.325s, 0.325s, 0s, 0s; }
.overlay::backdrop { background: rgb(0 0 0 / 0); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); transition: background-color 0.325s ease-in-out 0.325s, -webkit-backdrop-filter 0.325s ease-in-out 0.325s, backdrop-filter 0.325s ease-in-out 0.325s, display 0.65s allow-discrete, overlay 0.65s allow-discrete; }
.overlay:popover-open::backdrop { background: rgb(0 0 0 / 0.65); -webkit-backdrop-filter: blur(0.2rem); backdrop-filter: blur(0.2rem); transition-delay: 0s; }
@starting-style {
  .overlay:popover-open { opacity: 0; translate: 0 0.25rem; }
  .overlay:popover-open::backdrop { background: rgb(0 0 0 / 0); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); }
}
@supports not (overlay: auto) { /* browsers that drop the overlay from the top layer at once: close at once */
  .overlay:not(:popover-open) { transition: none; }
  .page { transition-delay: 0s; }
}
.overlay .close { position: absolute; top: 0; right: 0; width: 4rem; height: 4rem; padding: 0; border: 0; outline-offset: -0.25rem; color: inherit; background: none; cursor: pointer; } /* its focus ring inside, not clipped */
.overlay .close::before, .overlay .close::after { content: ""; position: absolute; top: 50%; left: 50%; width: 1.25rem; border-top: 1px solid; translate: -50% -50%; rotate: 45deg; } /* a cross */
.overlay .close::after { rotate: -45deg; }
@media (hover: hover) {
  .overlay .close:hover { background: rgb(255 255 255 / 0.15); }
}
@media print {
  .overlay:popover-open { display: none; } /* the page prints as when the overlay is closed */
}
/* The CV over the page (cv_overlay in _config.yml; overlay.css): its menu item, and the sheets under their title, in a column. */
.hero nav button { font-family: inherit; font-weight: inherit; line-height: inherit; color: inherit; background: none; cursor: pointer; }
.hero nav .cv-page { display: none; }
@supports not selector(:popover-open) { /* browsers without popovers: the cv item opens the CV page */
  .hero nav .cv-page { display: block; }
  .hero nav button { display: none; }
}
#cv-overlay { box-sizing: border-box; flex-direction: column; width: min(100%, 66rem); height: 100%; margin: 0 auto; padding: 0 1rem 3rem; overflow: hidden; }
#cv-overlay h2 { margin: 3rem 0 1rem; padding: 0 0 0 0.2em; border: 0; color: inherit; text-align: center; }
#cv-overlay > p { margin: 0 0 2rem; text-align: center; }
#cv-overlay .pdf { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; outline: none; } /* only the sheets scroll; focused on opening, for the keys */
#cv-overlay .pdf { flex: 0 1 auto; aspect-ratio: 612 / 792; border: 7px solid rgb(255 255 255 / 0.5); border-radius: 12px; } /* cv_frame: the width and grey of the macOS scroll bar; where the screen has room, the frame ends with the first page */
@media (pointer: coarse) {
  #cv-overlay .pdf { border-width: 3px; border-radius: 8px; } /* as a phone's scroll bar */
}
#cv-overlay figure { margin: 0 0 2.5rem; }
#cv-overlay figure:last-child { margin: 0; }
#cv-overlay a { color: inherit; }
#cv-overlay .pdf a { outline-offset: -0.25rem; } /* focus rings inside, not clipped */
/* A photo over the page (photo_overlay in _config.yml; overlay.css), opened by a click on it in the gallery. It takes the screen less 4rem
   above and below, at most half its file's width (sharp on a Retina screen), framed like the CV in the page's own background colour. */
.photos button { display: block; margin: 0 auto; padding: 0; border: 0; width: min(100%, 85vh * var(--ratio)); background: none; cursor: zoom-in; } /* as .photos a */
@supports not selector(:popover-open) {
  .photos button { cursor: default; }
}
.photo-overlay { --edge: 7px; align-items: flex-start; padding: 0; overflow: visible; outline: none; } /* focused on opening */
@media (pointer: coarse) {
  .photo-overlay { --edge: 3px; } /* as the CV's frame */
}
.photo-overlay img { width: min(100vw - 2rem - 2 * var(--edge), (100dvh - 8rem - 2 * var(--edge)) * var(--ratio), var(--cap)); height: auto; border: var(--edge) solid var(--bg); border-radius: calc(var(--edge) + 5px); }
.photo-overlay .close { top: auto; bottom: 100%; right: -1rem; } /* above the frame's corner, where the CV's is on a phone */
</style>
</head>
